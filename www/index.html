<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowline – Pipe Flow Puzzle</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#090e15"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Rajdhani:wght@500;700&family=Nunito:wght@500;700;800&family=Inter:wght@400;600;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#0f1b2a;--mut:#667587;--tile:#e4ebf3;--dry:#a3b1c0;--water:#0891b2;--line:#d9e1ea;--on:#fff;--bad:#e5484d;--gold:#d99a06;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#080d14;--card:#111a25;--tx:#e8eef5;--mut:#8493a5;--tile:#16212d;--dry:#46586b;--water:#22d3ee;--line:#223040;--on:#04121a;--gold:#facc15}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#080d14;--card:#111a25;--tx:#e8eef5;--mut:#8493a5;--tile:#16212d;--dry:#46586b;--water:#22d3ee;--line:#223040;--on:#04121a;--gold:#facc15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:radial-gradient(900px 420px at 50% -80px,color-mix(in srgb,var(--water) 16%,transparent),transparent),var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh;user-select:none;-webkit-user-select:none;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:3px}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.ib.on{color:var(--water);border-color:var(--water)}

.sg{color:var(--gold)}
.btn{display:block;width:100%;background:var(--water);color:var(--on);border:0;border-radius:16px;padding:16px 18px;font-weight:700;font-size:16px;transition:transform .12s,filter .12s;margin-top:12px;box-shadow:0 8px 22px color-mix(in srgb,var(--water) 35%,transparent)}
.btn:active{transform:scale(.97);filter:brightness(1.12)}
.btn.g{background:none;color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn:disabled,.btn.dis{opacity:.4;box-shadow:none}
.hide{display:none!important}
#sp{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .5s,transform .5s}
#sp.out{opacity:0;transform:scale(1.06);pointer-events:none}
#sp svg{width:170px;height:170px;overflow:visible}
#sp .d{fill:none;stroke:var(--dry);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
#sp .w{fill:none;stroke:var(--water);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:140;stroke-dashoffset:140;animation:dr 1.6s .5s ease-in-out forwards;filter:drop-shadow(0 0 7px var(--water))}
#sp .dp{fill:var(--water);animation:dp 1.1s ease-in both;transform-origin:18px 40px}
#sp .rn{fill:none;stroke:var(--water);stroke-width:2;transform-origin:102px 80px;animation:rn 1.4s 2s infinite;opacity:0}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes dp{from{transform:translateY(-70px) scale(.5);opacity:0}60%{opacity:1}to{transform:none}}
@keyframes rn{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
#sp h1{font-size:36px;margin-top:12px;animation:fi .8s .7s both}
#sp p{margin:0;color:var(--mut);font-size:14px;animation:fi .8s 1.1s both}
#sp small{margin-top:40px;font-weight:600;animation:bl 1.5s 2s infinite both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
@keyframes bl{50%{opacity:.3}}
.stats{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin:28px 0 8px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.stats span{font-size:11px;color:var(--mut)}
.tabs{display:flex;gap:28px;margin:34px 0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:0 0 12px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--water)}
/* world map */
.wd{position:relative;margin:0 0 26px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,hsl(var(--h) 65% 55%/.16),hsl(var(--h) 65% 55%/.03))}
.wh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;font-size:13px}
.wh b{font-size:15px}.wh span{color:var(--mut);font-size:12px}
.wd svg{width:100%;display:block}
.rdg{opacity:0}.wd.in .rdg{animation:fo .9s .1s forwards}
@keyframes fo{to{opacity:1}}
.rd{fill:none;stroke:color-mix(in srgb,var(--mut) 28%,transparent);stroke-width:14;stroke-linecap:round}
.sg2{fill:none;stroke:var(--water);stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--water))}
.fl{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:2.5;stroke-dasharray:2 11;stroke-linecap:round;animation:flw 1.2s linear infinite}
@keyframes flw{to{stroke-dashoffset:-13}}
.nd2{cursor:pointer;opacity:0;transform-box:fill-box;transform-origin:center}
.wd.in .nd2{animation:pp .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k)*70ms + .3s)}
@keyframes pp{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.nd2:active circle.nc{transform:scale(.9)}
.nc{fill:var(--card);stroke:var(--line);stroke-width:3;transform-box:fill-box;transform-origin:center;transition:transform .12s}
.nd2.cl .nc{fill:var(--water);stroke:color-mix(in srgb,var(--water) 60%,white)}
.nd2.cp .nc{stroke:var(--gold);stroke-width:4}
.nd2.nx .nc{stroke:var(--gold);stroke-width:4;animation:np 1.6s infinite}
@keyframes np{50%{stroke-width:9;stroke-opacity:.45}}
.nn{font-size:15px;font-weight:800;fill:var(--tx);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.nd2.cl .nn{fill:var(--on)}.nd2.lk .nc{fill:var(--tile);stroke:var(--line)}.nd2.lk .nn{fill:var(--mut)}.nd2.lk{cursor:not-allowed}
.ns{font-size:10px;fill:var(--gold);text-anchor:middle;pointer-events:none}
.ns .z{fill:color-mix(in srgb,var(--mut) 45%,transparent)}
.av{pointer-events:none}.av g{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.cloud{fill:#fff;opacity:.5;animation:cd 14s ease-in-out infinite alternate}
@keyframes cd{to{transform:translateX(36px)}}
/* rewards */
.sh{display:grid;gap:12px}
.it{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.it .ic{width:46px;height:46px;border-radius:14px;background:var(--tile);display:grid;place-items:center;font-size:19px;color:var(--water);flex:none}
.it b{display:block;font-size:14px}.it span{font-size:12px;color:var(--mut)}
.it .bt{margin-left:auto;flex:none;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;background:var(--tile);color:var(--mut)}
.it.can .bt{background:var(--gold);color:#1a1200}
.it.own{border-color:color-mix(in srgb,var(--water) 50%,var(--line))}
.it.own .bt{background:none;color:var(--water);padding-right:2px}
.bar{height:5px;border-radius:9px;background:var(--tile);overflow:hidden;margin:22px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--water);transition:width .5s;box-shadow:0 0 10px var(--water)}
.board{display:grid;gap:3px;margin:26px auto;justify-content:center;background:color-mix(in srgb,var(--line) 80%,var(--bg));padding:7px;border-radius:18px;width:max-content;max-width:100%;box-shadow:0 18px 44px rgba(0,0,0,.18)}
.t{background:var(--tile);border-radius:8px;overflow:hidden;cursor:pointer;position:relative;transition:filter .3s var(--d,0s),background .15s}
.t.tap{background:color-mix(in srgb,var(--water) 25%,var(--tile))}
.t svg{display:block;width:100%;height:100%;transition:transform .26s cubic-bezier(.3,1.5,.5,1)}
.p{stroke:var(--dry);stroke-width:22;fill:none;transition:stroke .35s var(--d,0s)}
.pi{stroke:color-mix(in srgb,var(--dry) 70%,white);stroke-width:8;fill:none;transition:stroke .35s var(--d,0s)}
.pc{fill:var(--dry);transition:fill .35s var(--d,0s)}
.t.w .p{stroke:var(--water)}.t.w .pc{fill:var(--water)}.t.w .pi{stroke:color-mix(in srgb,var(--water) 45%,white)}
.t.w{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--water) 70%,transparent))}
.t.src{cursor:default;background:var(--card)}
.t.hint{animation:hint .5s 3;outline:2px solid var(--gold);z-index:2}
@keyframes hint{50%{transform:scale(1.1)}}
.hud{display:flex;justify-content:space-between;font-weight:600;font-size:13px;color:var(--mut);gap:8px;flex-wrap:wrap}
.hud b{color:var(--tx)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.acts button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 4px;font-weight:600;font-size:12px;transition:transform .12s;line-height:1.35}
.acts button:active{transform:scale(.94)}
.acts button:disabled,.acts button.dis{opacity:.35}
.acts span{display:block;font-size:20px;color:var(--water);line-height:1.2}
.acts small{display:block;color:var(--mut);font-size:10px}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.thump{animation:th .5s}
@keyframes th{30%{transform:scale(1.03)}}
#ov{position:fixed;inset:0;background:rgba(3,8,14,.66);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#ov.show{display:flex}
.md{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;max-width:380px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1);max-height:88vh;overflow:auto}
.md.l{text-align:left;font-size:13px}
.md h2{margin:0 0 8px;font-size:20px}
.md p{margin:8px 0;color:var(--mut);font-size:13px}
.md .st{font-size:46px;letter-spacing:8px;color:var(--gold);margin:10px 0}
.md .st i{display:inline-block;animation:pop .5s backwards;font-style:normal}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* unlock popup */
#uo{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--water) 30%,rgba(3,8,14,.7)),rgba(3,8,14,.94) 72%);animation:fa .4s;overflow:hidden;touch-action:none}
#uo.show{display:flex}
@keyframes fa{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:40%;margin:-75vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--water) 32%,transparent) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 22s linear infinite,fa 1s .8s both}
.charge{position:absolute;left:50%;top:40%;width:120px;height:120px;margin:-60px;border-radius:50%;background:radial-gradient(circle,#fff,var(--water) 55%,transparent 70%);animation:chg .85s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes chg{0%{transform:scale(.1);opacity:.2}85%{transform:scale(1.5);opacity:1}100%{transform:scale(3);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl2 .55s .78s ease-out}
@keyframes fl2{0%{opacity:.85}100%{opacity:0}}
.shock{position:absolute;left:50%;top:40%;width:140px;height:140px;margin:-70px;border-radius:50%;border:3px solid #fff;opacity:0;animation:sw 1.2s .8s ease-out}
@keyframes sw{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(5)}}
.uc{position:relative;text-align:center;color:#fff;max-width:320px;width:100%}
.uc>*{animation:up .7s cubic-bezier(.2,1.4,.4,1) both}
.uc>:nth-child(2){animation-delay:1s}.uc>:nth-child(3){animation-delay:1.1s}.uc>:nth-child(4){animation-delay:1.2s}.uc>:nth-child(5){animation-delay:1.3s}.uc>:nth-child(6){animation-delay:1.45s}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.85)}}
.ill{position:relative;width:170px;height:170px;margin:0 auto 18px;animation:ill .9s .8s cubic-bezier(.2,1.5,.4,1) both,flt 3s 1.7s ease-in-out infinite!important}
.ill::before{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--water) 70%,transparent),transparent 65%);animation:glw 2s ease-in-out infinite}
.ill svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 8px 22px rgba(0,0,0,.4))}
@keyframes ill{from{opacity:0;transform:scale(0) rotate(-25deg)}}
@keyframes flt{50%{transform:translateY(-9px)}}
@keyframes glw{50%{transform:scale(1.15);opacity:.7}}
.rib{display:inline-block;padding:5px 14px;border-radius:99px;background:linear-gradient(90deg,var(--gold),#fff3b0);color:#2a1d00;font-size:11px;font-weight:800;letter-spacing:3px}
.uc h2{margin:12px 0 4px;font-size:28px}.uc p{margin:0;opacity:.85;font-size:14px}
.spent{display:inline-block;margin-top:12px;font-size:12px;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.12)}
.uc .btn{margin-top:22px;background:#fff;color:#0b1520;box-shadow:0 0 30px rgba(255,255,255,.35)}
.spk{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px var(--gold);pointer-events:none;z-index:160;animation:sk 1.4s ease-out forwards}
@keyframes sk{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;transition:.3s;z-index:250;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.rg{position:fixed;width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid var(--water);background:color-mix(in srgb,var(--water) 25%,transparent);pointer-events:none;animation:rg .6s ease-out forwards;z-index:400}
@keyframes rg{to{transform:scale(4.5);opacity:0}}
.sp2{position:fixed;font-size:20px;color:var(--gold);animation:fly 1.4s ease-out forwards;z-index:70;pointer-events:none}
@keyframes fly{to{transform:translate(var(--x),-140px) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#sp .w{stroke-dashoffset:0}.nd2,.rdg{opacity:1}}
html.lk,html.lk body{overflow:hidden;overscroll-behavior:none}
#sp{touch-action:none;overscroll-behavior:contain}
.md{overscroll-behavior:contain}
@keyframes vin{from{opacity:0;transform:translateY(12px)}}
#mapV:not(.hide),#gameV:not(.hide){animation:vin .4s cubic-bezier(.2,.8,.3,1)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px}
.lg{width:40px;height:40px;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--water) 45%,transparent))}
.brand h1{font-size:19px;line-height:1.1}.brand small{font-size:11px;color:var(--mut);letter-spacing:.3px}
.tools{display:flex;gap:7px}
.rb{position:relative;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--water);padding:0;font-size:15px;transition:transform .12s,color .2s}
.rb:active{transform:scale(.88)}
.rb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.off{color:var(--mut)}
.rb.off::after{content:"";position:absolute;width:22px;height:2px;background:var(--bad);transform:rotate(-45deg);border-radius:2px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.08)}
.chips{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.chip{display:flex;align-items:center;gap:10px;background:var(--tile);border-radius:16px;padding:11px 12px;min-width:0}
.chip .ci{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);flex:none}
.chip .ci svg{width:20px;height:20px}
.chip b{display:block;font-size:21px;line-height:1.2;font-weight:800}
.chip small{font-size:11px;color:var(--mut)}
.chip .hf{display:flex;flex-wrap:wrap}.chip .hf i{width:16px;height:16px}
.prog{margin:16px 2px 4px}.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.pl b{color:var(--tx)}
.pb{height:8px;border-radius:9px;background:var(--tile);margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--water),color-mix(in srgb,var(--water) 55%,white));transition:width 1s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 12px var(--water)}
.cta{display:flex;gap:10px;margin-top:14px}.cta .btn{margin:0;flex:1}
.wa{width:54px;border-radius:16px;display:grid;place-items:center;flex:none;transition:transform .12s;background:#25D366;border:0;box-shadow:0 8px 20px rgba(37,211,102,.3)}
.wa:active{transform:scale(.92)}.wa svg{width:27px;height:27px;fill:#fff}
.btn.wa2{background:#25D366;color:#fff;box-shadow:0 8px 22px rgba(37,211,102,.3)}
.hf i{display:inline-block;width:19px;height:19px;margin-right:2px;font-style:normal;color:inherit}
.hf i svg{display:block;width:100%;height:100%;fill:var(--line);transition:fill .3s}
.hf i.on svg{fill:var(--bad);filter:drop-shadow(0 0 4px rgba(229,72,77,.55))}
.gtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.gt{text-align:center}.gt b{display:block;font-size:16px;line-height:1.2}.gt small{font-size:11px;color:var(--mut)}
.hud3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-top:16px}
.chip2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;transition:border-color .3s,background .3s}
.chip2 small{display:block;font-size:10px;color:var(--mut);letter-spacing:.4px;text-transform:uppercase}
.chip2 b{font-size:17px;font-weight:800}.chip2 b span{font-size:12px;color:var(--mut);font-weight:600;margin-left:2px}
.chip2.warn{border-color:var(--gold)}.chip2.bad{border-color:var(--bad);animation:pulseb 1s infinite}
@keyframes pulseb{50%{background:color-mix(in srgb,var(--bad) 12%,var(--card))}}
.mb{height:4px;border-radius:9px;background:var(--tile);margin-top:6px;overflow:hidden}
.mb i{display:block;height:100%;width:0;background:var(--water);transition:width .35s,background .3s}
.chip2.warn .mb i{background:var(--gold)}.chip2.bad .mb i{background:var(--bad)}
.acts .ab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:14px 4px 11px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.ab .aic{width:40px;height:40px;border-radius:13px;background:color-mix(in srgb,var(--water) 14%,transparent);color:var(--water);display:grid;place-items:center;margin-bottom:4px;transition:transform .2s;font-style:normal}
.ab:active .aic{transform:scale(.88) rotate(-8deg)}
.ab .aic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts .ab .bg{position:absolute;top:8px;right:10px;min-width:20px;height:20px;border-radius:10px;background:var(--water);color:var(--on);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;line-height:1}
.ab b{font-size:13px}.acts .ab small{font-size:10px;color:var(--mut)}
.acts .ab.dis .aic{filter:grayscale(1)}
.flt{position:fixed;left:50%;top:104px;font-weight:800;font-size:20px;pointer-events:none;z-index:240;animation:fup 1.2s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.35);white-space:nowrap}
@keyframes fup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}
body.ig .wrap{padding:10px 14px}

  if(r()<bias){const f=cs.filter(e=>e[0]==last);if(f.length)cs=f}
  const[v,d,w]=cs[r()*cs.length|0];
  sol[v]|=B[d];sol[w]|=B[(d+2)%4];deg[v]++;deg[w]++;vis[w]=true;dep[w]=dep[v]+1;last=w;cn++;
 }
 sol[src]=15;
 const b0=l<7?1:l<19?7:l<37?19:l<59?37:l<81?59:81,b1=l<7?6:l<19?18:l<37?36:l<59?58:l<81?80:100,lp=(l-b0)/Math.max(1,b1-b0);

function claimDaily(el){if(S.dgd===today()){deny(el,"Come back tomorrow for the next gift");return}const g=DG[S.dgs%DG.length];S.dgd=today();S.dgs++;giveG(g);afterGift();setTimeout(()=>rewardPop("Daily gift",gtxt(g)),150)}
function claimMile(at,el){const m=MG.find(x=>x.at==at);if(!m||S.mg[at])return;if(clearedN()<at){deny(el,"Clear "+(at-clearedN())+" more levels first");return}S.mg[at]=1;giveG(m.g);afterGift();setTimeout(()=>rewardPop("Cleared "+at+" levels",gtxt(m.g)),150)}
function buyPack(id,el){const p=PACKS.find(x=>x.id==id);if(!p)return;if(avail()<p.c){deny(el,"You need "+(p.c-avail())+" more ★ for "+p.n);return}S.sp+=p.c;giveG(p.g);afterGift();SFX.buy();setTimeout(()=>unlockPop(p,{rib:"PURCHASED",sub:"-"+p.c+"★ · "+avail()+"★ left"}),170)}
function giftsHTML(){
 const dg=DG[S.dgs%DG.length],can=S.dgd!==today(),c=clearedN();
 let h='<div class="it '+(can?"can":"")+'"><div class="ic">'+IC.gift+'</div><div style="flex:1"><b>Daily gift</b><span>'+gtxt(dg)+'</span></div><button class="bt" onclick="claimDaily(this.closest(\'.it\'))">'+(can?"Claim":"Tomorrow")+"</button></div>";
 MG.filter(m=>!S.mg[m.at]).slice(0,3).forEach(m=>{const ok=c>=m.at;h+='<div class="it '+(ok?"can":"")+'"><div class="ic">'+IC.gift+'</div><div style="flex:1"><b>Clear '+m.at+' levels</b><span>'+gtxt(m.g)+"</span>"+(ok?"":'<div class="mini"><i style="width:'+Math.min(100,c/m.at*100)+'%"></i></div>')+'</div><button class="bt" onclick="claimMile('+m.at+',this.closest(\'.it\'))">'+(ok?"Claim":c+"/"+m.at)+"</button></div>"});
 return h}
function prev(id){const t=TH[id],p=t.pv;return '<svg viewBox="0 0 120 64"><rect width="120" height="64" fill="'+p.bg+'"/><path d="M8 46H46V20H96" fill="none" stroke="'+p.dry+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 46H46V30" fill="none" stroke="'+p.a+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="20" r="13" fill="'+p.b+'"/><g transform="translate(82 6) scale(.28)"><path d="'+t.e+'" fill="#fff"/></g></svg>'}
function themeCard(id){const t=TH[id],o=id=="aqua"||own(id),on=S.sk==id,can=!o&&avail()>=t.c;
 return '<div class="tcard'+(on?" on":"")+(o?"":can?" can":"")+'" onclick="'+(o?"setSkin('"+id+"')":"buy('"+id+"',this)")+'">'+prev(id)+"<b>"+t.n+"</b><span>"+t.d+'</span><div class="tb2">'+(on?"Equipped":o?"Use theme":(can?"Unlock · ":"")+t.c+"★")+"</div></div>"}
function perkRow(i){const o=own(i.id),can=!o&&avail()>=i.c;return '<div class="it '+(o?"own":can?"can":"")+'"><div class="ic">'+i.i+'</div><div style="flex:1"><b>'+i.n+"</b><span>"+i.d+'</span></div><button class="bt" onclick="buy(\''+i.id+"',this.closest('.it'))\">"+(o?"Unlocked":(can?"Unlock ":"")+i.c+"★")+"</button></div>"}
function packRow(p){const can=avail()>=p.c;return '<div class="it '+(can?"can":"")+'"><div class="ic">'+({fh:"◎",un:"↶",h:"♥"}[p.t])+'</div><div style="flex:1"><b>'+p.n+"</b><span>"+p.d+'</span></div><button class="bt" onclick="buyPack(\''+p.id+"',this.closest('.it'))\">"+p.c+"★</button></div>"}
function renderShop(){
 const a=avail();
 let h='<div class="wal"><div><small>Stars to spend</small><b>'+a+"</b><span>Earned "+earned()+"★ · Spent "+S.sp+'★</span></div><div class="inv"><div><b>'+S.inv.h+"</b><small>Hints</small></div><div><b>"+S.inv.u+"</b><small>Undos</small></div><div><b>"+S.inv.l+"</b><small>Lives</small></div></div></div>";
 h+='<h4 class="sec">Gifts</h4><div class="sh">'+giftsHTML()+"</div>";
 h+='<h4 class="sec">Themes</h4><div class="thg">'+Object.keys(TH).map(themeCard).join("")+"</div>";
 h+='<h4 class="sec">Boosts</h4><div class="sh">'+ITEMS.filter(i=>i.t!="skin").map(perkRow).join("")+"</div>";
 h+='<h4 class="sec">Packs</h4><div class="sh">'+PACKS.map(packRow).join("")+"</div>";
 h+='<p class="note">Stars are lost on hints beyond your free and pack hints, on new puzzles, and for every 25 lost chances ('+(S.lc%25)+"/25). Your balance can never go below zero.</p>";
 $("#p1").innerHTML=h;
}
function buy(id,el){
 const i=ITEMS.find(x=>x.id==id);if(!i||own(id)){hap(8);return}
 if(avail()<i.c){deny(el,"You need "+(i.c-avail())+" more ★ for "+i.n);return}
 S.sp+=i.c;S.own[id]=1;if(i.t=="skin"){S.sk=id;skin();if(AC)music()}if(i.t=="h")S.h=Math.min(S.h+1,maxH());save();
 SFX.buy();setTimeout(()=>unlockPop(i),180);renderShop();setNum($("#sSt"),avail());bump($("#sSt"));tick();
}
function ill(i){
 const W='fill="none" stroke-linecap="round" stroke-linejoin="round"',c=i.col||"var(--water)";
 const M={
 skin:'<path d="M18 114H58V80H122" '+W+' stroke="#fff" stroke-opacity=".22" stroke-width="22"/><path d="M18 114H58V80H122" '+W+' stroke="currentColor" stroke-width="14"/><path d="M18 114H58V80H122" '+W+' stroke="#fff" stroke-opacity=".55" stroke-width="4"/><g transform="translate(20 -6)"><path d="'+(TH[i.id]?TH[i.id].e:"")+'" fill="currentColor" stroke="#fff" stroke-width="3"/></g>',
 un:'<circle cx="70" cy="72" r="48" fill="currentColor" opacity=".2"/><path d="M44 56A32 32 0 1 1 40 90" '+W+' stroke="#fff" stroke-width="12"/><path d="M32 34v26h26" '+W+' stroke="currentColor" stroke-width="12"/>',
 h:'<path d="M70 124S14 88 14 50a28 28 0 0 1 56-9 28 28 0 0 1 56 9c0 38-56 74-56 74z" fill="#ff4d6d" stroke="#fff" stroke-width="5"/><path d="M40 42a16 16 0 0 1 14-9" '+W+' stroke="#fff" stroke-opacity=".7" stroke-width="6"/>',
 fh:'<path d="M70 12a40 40 0 0 0-22 73c4 3 6 7 6 12h32c0-5 2-9 6-12A40 40 0 0 0 70 12z" fill="currentColor" stroke="#fff" stroke-width="5"/><rect x="54" y="106" width="32" height="9" rx="4.5" fill="#fff"/><rect x="58" y="120" width="24" height="9" rx="4.5" fill="#fff"/><path d="M58 52l12 14 12-14" '+W+' stroke="#fff" stroke-opacity=".85" stroke-width="6"/>',
 fast:'<circle cx="70" cy="70" r="52" fill="currentColor" opacity=".2"/><circle cx="70" cy="70" r="44" '+W+' stroke="#fff" stroke-width="8"/><path d="M70 40v32l20 12" '+W+' stroke="#fff" stroke-width="8"/><path d="M98 10 84 38h14L80 66" '+W+' stroke="currentColor" stroke-width="9"/>',
 gift:'<rect x="24" y="62" width="92" height="64" rx="8" fill="currentColor" stroke="#fff" stroke-width="5"/><rect x="18" y="44" width="104" height="26" rx="8" fill="currentColor" stroke="#fff" stroke-width="5"/><path d="M70 44v82" stroke="#fff" stroke-width="10"/><path d="M70 44C52 22 30 28 38 40c4 7 22 4 32 4zM70 44c18-22 40-16 32-4-4 7-22 4-32 4z" fill="#fff"/>'};
 return '<svg viewBox="0 0 140 140" style="color:'+c+'">'+(M[i.t]||M.skin)+'</svg>';
}
function burst(){const cols=["var(--gold)","#fff","var(--water)"];for(let k=0;k<44;k++){const s=document.createElement("span"),a=Math.random()*6.28,d=90+Math.random()*170;s.className="spk";s.style.left="50%";s.style.top="40%";s.style.background=cols[k%3];s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d+"px");s.style.animationDelay=Math.random()*.25+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}}
function unlockPop(i,o){
 o=o||{};const u=$("#uo");if(i.col)u.style.setProperty("--water",i.col);else u.style.removeProperty("--water");
 const sub=o.sub!==undefined?o.sub:"-"+i.c+"★ · "+avail()+"★ left"+(i.t=="skin"?" · applied":"");
 u.innerHTML='<div class="rays"></div><div class="charge"></div><div class="shock"></div><div class="flash"></div><div class="uc"><div class="ill" style="color:'+(i.col||"var(--water)")+'">'+ill(i)+'</div><div><span class="rib">'+(o.rib||"NEW UNLOCK")+"</span></div><h2>"+i.n+"</h2><p>"+i.d+'</p><div><span class="spent">'+sub+'</span></div><button class="btn" onclick="closeUnlock()">Awesome</button></div>';
 u.classList.add("show");lockScroll();(o.snd||SFX.unlock)();hap([15,40,15,40,15,40,15]);setTimeout(()=>{hap(90);burst()},780);
}
function closeUnlock(){const u=$("#uo");u.classList.remove("show");u.innerHTML="";lockScroll();SFX.tap()}
function useLife(inGame){if(S.inv.l<1)return;S.inv.l--;S.h=Math.min(2,maxH());S.t=Date.now();save();SFX.buy();hap([20,40,20]);if(inGame&&G)retry();else{ov();renderMap()}}
function fixS(){const old={ember:8,aurora:8,sunset:10,gold:12};for(const k in old)if(S.own[k]){S.sp-=old[k];delete S.own[k]}
 S.inv=Object.assign({h:0,u:0,l:0},S.inv);S.mg=S.mg||{};S.bonus=S.bonus||0;if(!TH[S.sk]||(S.sk!="aqua"&&!own(S.sk)))S.sk="aqua";S.sp=Math.max(0,Math.min(S.sp,earned()));save()}
function skin(){if(!TH[S.sk])S.sk="aqua";if(S.sk=="aqua")document.documentElement.removeAttribute("data-skin");else document.documentElement.dataset.skin=S.sk}
function setSkin(k){S.sk=k;save();skin();hap(15);SFX.tap();if(AC)music();renderShop()}
function endSplash(){const s=$("#sp");if(!s||s.classList.contains("out"))return;s.classList.add("out");au();music();SFX.start();hap(20);setTimeout(()=>{s.remove();lockScroll();if(!S.tour&&!$("#tour")&&!$("#mapV").classList.contains("hide"))setTimeout(()=>startTour(HOME_TOUR,"tour"),450)},600)}
document.addEventListener("pointerdown",e=>{const r=document.createElement("i");r.className="rg";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";document.body.appendChild(r);setTimeout(()=>r.remove(),650)});
addEventListener("resize",()=>{if(G&&!$("#gameV").classList.contains("hide"))fit()});
load();fixS();skin();renderMap();lockScroll();setInterval(tick,1000);
</script>
<script>
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0&&location.hostname!="localhost")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(A)A.addListener("backButton",()=>{if($("#tour"))tourEnd();else if($("#uo").classList.contains("show"))closeUnlock();else if($("#ov").classList.contains("show"))ov();else if(!$("#gameV").classList.contains("hide"))toMap();else A.exitApp()})}catch(e){}
</script>
</body>
